services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: veille_db
    volumes:
      - veille_pgdata:/var/lib/postgresql/data
    networks:
      - veille_net
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    networks:
      - veille_net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - veille_net
    depends_on:
      - api
    restart: unless-stopped

volumes:
  veille_pgdata:

networks:
  veille_net:
    external: true
